<div class="card"
     *ngIf="card.items | filterDevices as devices"
     [appHighlightActive]="devices | hasActiveDevice">
  <div class="card-header">
    <h3 class="card-title">{{ card.title }}</h3>

    <div class="group-toggle" *ngIf="hasGroupToggle(devices)">
      <label class="switch">
        <input type="checkbox"
               [checked]="isGroupOn(devices)"
               (change)="onGroupToggle(devices)">
        <span class="slider"></span>
      </label>
    </div>
  </div>

  <div class="card-content" [ngClass]="'layout-' + card.layout">
    <ng-container *ngFor="let item of card.items; let i = index">
      <app-device
        *ngIf="isDevice(item)"
        [device]="item"
        [layout]="card.layout === 'singleDevice' ? 'single' : 'multi'"
        (stateChange)="onDeviceStateChange(i, $event)">
      </app-device>

      <app-sensor
        *ngIf="item.type === 'sensor'"
        [sensor]="item">
      </app-sensor>
    </ng-container>
  </div>
</div>
