<div class="modal-overlay" *ngIf="isVisible()" (click)="hide()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Создать новый дашборд</h2>
      <button class="close-button" (click)="hide()" type="button">
        <span class="close-icon">×</span>
      </button>
    </div>

    <form [formGroup]="createForm" (ngSubmit)="onSubmit()" class="modal-form">
      <div class="form-group">
        <label for="id">ID дашборда *</label>
        <input
          id="id"
          type="text"
          formControlName="id"
          placeholder="Введите уникальный ID"
          [class.invalid]="isFieldInvalid('id')"
        />
        <div class="error-message" *ngIf="getFieldError('id')">
          {{ getFieldError('id') }}
        </div>
        <div class="field-info">
          Максимум 30 символов, только буквы, цифры, дефисы и подчеркивания
        </div>
      </div>

      <div class="form-group">
        <label for="title">Название *</label>
        <input
          id="title"
          type="text"
          formControlName="title"
          placeholder="Введите название дашборда"
          [class.invalid]="isFieldInvalid('title')"
        />
        <div class="error-message" *ngIf="getFieldError('title')">
          {{ getFieldError('title') }}
        </div>
        <div class="field-info">
          Максимум 50 символов
        </div>
      </div>

      <div class="form-group">
        <label for="icon">Иконка *</label>
        <div class="icon-selector">
          <div class="icon-grid">
            <div
              *ngFor="let icon of availableIcons"
              class="icon-option"
              [class.selected]="createForm.get('icon')?.value === icon"
              (click)="createForm.patchValue({ icon })"
            >
              <span class="material-icons">{{ icon }}</span>
            </div>
          </div>
        </div>
        <div class="error-message" *ngIf="getFieldError('icon')">
          {{ getFieldError('icon') }}
        </div>
      </div>

      <div class="error-message general-error" *ngIf="getFieldError('general')">
        {{ getFieldError('general') }}
      </div>

      <div class="form-actions">
        <button type="button" class="btn-secondary" (click)="hide()" [disabled]="isLoading()">
          Отмена
        </button>
        <button type="submit" class="btn-primary" [disabled]="createForm.invalid || isLoading()">
          <span *ngIf="!isLoading()">Создать</span>
          <span *ngIf="isLoading()">Создание...</span>
        </button>
      </div>
    </form>
  </div>
</div>
